<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        color: #333;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    h1 {
        margin-top: 50px;
        font-size: 2em;
        color: #222;
    }

    #user-greeting {
        margin: 20px 0;
        font-size: 1.2em;
        color: #4CAF50;
    }

    nav {
        margin-top: 20px;
    }

    nav a {
        text-decoration: none;
        color: #fff;
        background: #4CAF50;
        padding: 10px 15px;
        margin: 0 10px;
        border-radius: 5px;
        transition: background 0.3s;
    }

    nav a:hover {
        background: #45a049;
    }
</style>
</head>
<body>
<h1>Welcome to the Home Page!</h1>
<div id="user-greeting"></div>
<nav>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
</nav>
<script>
    const responseAPI = async () => {
        let res = await fetch('/check-session');
        const data = await res.json();
        if (data.username) {
            const greeting = document.getElementById('user-greeting');
            greeting.textContent = `Hello, ${data.username}`;
            const links = document.getElementsByTagName('a');
            for (let a of links) {
                a.style.display = 'none';
            }
        }
    };
    document.addEventListener('DOMContentLoaded', responseAPI);
</script>
</body>
</html>
